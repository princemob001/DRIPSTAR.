<style>
  .gallery {
    display: flex;
    gap: 20px; /* spacing between items */
    justify-content: center; /* center them horizontally */
  }

  .item {
    text-align: center; /* centers text and button under image */
    width: 380px; /* same as image width */
  }

  .item img {
    width: 100%;
    height: auto;
    border-radius: 8px; /* optional: rounded corners */
  }

  .item h3 {
    margin: 10px 0 5px; /* spacing above/below text */
    font-size: 18px;
  }

  .item button {
    padding: 8px 16px;
    background-color: #333;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .item button:hover {
    background-color: #555;
  }
</style>

<div class="gallery">
  <div class="item">
    <img src="drip222.webp" alt="Drip 222">
    <h3>Drip 222</h3>
    <button>Order</button>
  </div>

  <div class="item">
    <img src="drip111.webp" alt="Drip 111">
    <h3>Drip 111</h3>
    <button>Order</button>
  </div>

  <div class="item">
    <img src="drip333.webp" alt="Drip 333">
    <h3>Drip 333</h3>
    <button>Order</button>
  </div>
</div>

</style>
