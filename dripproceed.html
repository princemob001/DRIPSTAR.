<body>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dripstar Fashion - Checkout</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; }
    .container { max-width: 800px; margin: auto; padding: 20px; background: #fff; border-radius: 8px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
    th { background: #333; color: #fff; }
    .total { text-align: right; margin-top: 20px; font-size: 1.5em; font-weight: bold; }
    .place-order { display: block; margin: 30px auto; padding: 12px 24px; background: #28a745; color: #fff; border: none; border-radius: 4px; font-size: 1.2em; cursor: pointer; }
    .place-order:hover { background: #218838; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Checkout</h1>
    <table id="checkoutTable">
      <thead>
        <tr>
          <th>Product</th>
          <th>Size</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Subtotal</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="total" id="checkoutTotal">Total: ₦0</div>
    <button class="place-order" onclick="placeOrder()">Place Order</button>
  </div>

  <script>
    function renderCheckout() {
      const cart = JSON.parse(localStorage.getItem("dripstarCart")) || [];
      const tbody = document.querySelector("#checkoutTable tbody");
      tbody.innerHTML = "";
      let total = 0;

      cart.forEach(item => {
        const subtotal = item.price * item.quantity;
        total += subtotal;

        const row = `
          <tr>
            <td>${item.product}</td>
            <td>${item.size}</td>
            <td>₦${item.price}</td>
            <td>${item.quantity}</td>
            <td>₦${subtotal}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });

      document.getElementById("checkoutTotal").innerText = `Total: ₦${total}`;
    }

    function placeOrder() {
      alert("✅ Thank you! Your order has been placed.");
      localStorage.removeItem("dripstarCart"); // clear cart
      window.location.href = "dripmain.html"; // redirect back to shop
    }

    renderCheckout();
  </script>
</body>
</html>
</body>
</html>
