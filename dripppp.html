<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background: #f9f9f9;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }
    .product {
      display: flex;
      gap: 40px;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .product img {
      max-width: 400px;
      border-radius: 8px;
    }
    .details {
      flex: 1;
    }
    .details h1 {
      margin-top: 0;
      font-size: 2em;
    }
    .price {
      font-size: 1.5em;
      color: #e63946;
      margin: 10px 0;
    }
    .options {
      margin: 20px 0;
    }
    .options label {
      display: block;
      margin-bottom: 8px;
    }
    .options select {
      padding: 8px;
      width: 200px;
    }
    .add-to-cart {
      margin-top: 20px;
    }
    .add-to-cart button {
      background: #333;
      color: #fff;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1em;
    }
    .add-to-cart button:hover {
      background: #555;
    }
    .cart-message {
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="product">
      <img src="drip88.webp" alt="DSF blue y2k jeans">
      <div class="details">
        <h1>Dripstar blue y2k jeans</h1>
        <p>Step into timeless style with our vintage y2k jeans, crafted for comfort and drip-certified fashion.</p>
        <div class="price">$120</div>

        <div class="options">
          <label for="size">Choose Size:</label>
          <select id="size">
            <option value="S">Small</option>
            <option value="M">Medium</option>
            <option value="L">Large</option>
            <option value="XL">XL</option>
          </select>
        </div>

        <div class="add-to-cart">
          <button onclick="addToCart()">Add to Cart</button>
          <div id="cartMessage" class="cart-message"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function addToCart() {
      const size = document.getElementById('size').value;
      document.getElementById('cartMessage').innerText =
        `✅ Added Dripstar blue y2k jeans (Size: ${size}) to cart! Rugged you`;
    }
  </script> 
</body>
</html>
