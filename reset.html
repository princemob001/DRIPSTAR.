<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dripstar Reset Password</title>
  <style>
    body {
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
    }
    .form {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
      width: 350px;
      text-align: center;
    }
    h2 {
      color: #fff;
      margin-bottom: 20px;
    }
    .inputbox {
      margin: 20px 0;
    }
    .inputbox input {
      width: 100%;
      padding: 12px 15px;
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
    }
    .submitbtn {
      border-radius: 25px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
      border: none;
      background: linear-gradient(90deg, #0fff, #00ff80);
      padding: 12px 30px;
      color: #000;
      width: 100%;
    }
    .message {
      margin-top: 15px;
      font-weight: bold;
    }
    .error { color: red; }
    .success { color: lime; }
    label {
      color: #fff;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="form">
    <h2>Dripstar Reset Password</h2>
    <div class="inputbox">
      <input type="email" id="email" placeholder="Enter your registered email">
    </div>
    <div class="inputbox">
      <input type="password" id="newPassword" placeholder="New Password">
    </div>
    <div class="inputbox">
      <input type="password" id="confirmPassword" placeholder="Confirm New Password">
    </div>

    <label>
      <input type="checkbox" id="showPassword" onclick="togglePassword()"> Show Password
    </label>
    <br><br>

    <button class="submitbtn" onclick="resetPassword()">Reset Password</button>
    <br><br>
    <button class="submitbtn" onclick="window.location.href='driplogin.html'">Back to Login</button>
    <div id="message" class="message"></div>
  </div>

  <script>
    function resetPassword() {
      const email = document.getElementById("email").value.trim();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      const savedEmail = localStorage.getItem("userEmail");

      if (!email || !newPassword || !confirmPassword) {
        showMessage("Please fill in all fields", "error");
        return;
      }

      if (email !== savedEmail) {
        showMessage("Email not found. Please register first.", "error");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("Passwords do not match", "error");
        return;
      }

      localStorage.setItem("userPassword", newPassword);
      showMessage("Password reset successful! You can now log in.", "success");

      setTimeout(() => {
        window.location.href = "driplogin.html";
      }, 1500);
    }

    function togglePassword() {
      const newPasswordField = document.getElementById("newPassword");
      const confirmField = document.getElementById("confirmPassword");
      const type = document.getElementById("showPassword").checked ? "text" : "password";
      newPasswordField.type = type;
      confirmField.type = type;
    }

    function showMessage(msg, type) {
      const messageDiv = document.getElementById("message");
      messageDiv.textContent = msg;
      messageDiv.className = "message " + type;
    }

    localStorage.setItem("userPassword", newPassword);
localStorage.setItem("passwordResetSuccess", "true"); 


  </script>
</body>
</html>
