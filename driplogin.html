<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dripstar Login</title>
  <style>
    body { background:#0d0d0d; display:flex; justify-content:center; align-items:center; height:100vh; font-family:Arial, Helvetica, sans-serif; }
    .form { background:rgba(255,255,255,0.1); padding:40px; border-radius:15px; box-shadow:0 0 15px rgba(0,255,255,0.3); width:320px; text-align:center; }
    h2 { color:#fff; margin-bottom:20px; }
    .inputbox { margin:20px 0; }
    .inputbox input { width:100%; padding:12px 15px; background:none; border:none; outline:none; color:#fff; font-size:18px; border-bottom:2px solid rgba(255,255,255,0.5); }
    .submitbtn { border-radius:25px; cursor:pointer; margin-top:10px; font-weight:bold; border:none; background:linear-gradient(90deg,#0fff,#00ff80); padding:12px 30px; color:#000; width:100%; }
    .message { margin-top:15px; font-weight:bold; }
    .error { color:red; }
    .success { color:lime; }
    label { color:#fff; font-size:14px; }
  </style>
</head>
<body>
  <div class="form">
    <h2>Dripstar LOGIN</h2>
    <div class="inputbox"><input type="text" id="email" placeholder="Email"></div>
    <div class="inputbox"><input type="password" id="password" placeholder="Password"></div>
    <div>
      <label><input type="checkbox" id="stayLoggedIn"> Stay Logged In</label>
    </div>
    <button class="submitbtn" onclick="login()">LOGIN</button>
    <button class="submitbtn" onclick="window.location.href='register.html'">REGISTER</button>
    <br><br>
    <button class="submitbtn" onclick="window.location.href='dripcollection.html'">Back To Shop</button>
    <div id="message" class="message"></div>
    <br>
    <b><a href="reset.html">Forgotten password</a></b>
  </div>

  <script>
    function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const stayLoggedIn = document.getElementById("stayLoggedIn").checked;

      const savedEmail = localStorage.getItem("userEmail");
      const savedPassword = localStorage.getItem("userPassword");

      if (email === savedEmail && password === savedPassword) {
        showMessage("Login successful! Redirecting...", "success");

        localStorage.setItem("isLoggedIn", "true");

        if (stayLoggedIn) {
          localStorage.setItem("stayLoggedIn", "true");
        } else {
          localStorage.removeItem("stayLoggedIn");
        }

        window.location.href = "profile.html";
      } else {
        showMessage("Wrong email or password!", "error");
      }
    }

    function showMessage(msg, type) {
      const messageDiv = document.getElementById("message");
      messageDiv.textContent = msg;
      messageDiv.className = "message " + type;
    }

    window.onload = function() {
      const savedEmail = localStorage.getItem("userEmail");
      const savedPassword = localStorage.getItem("userPassword");

      document.getElementById("email").value = savedEmail || "";
      document.getElementById("password").value = savedPassword || "";

      if (localStorage.getItem("isLoggedIn") === "true" && localStorage.getItem("stayLoggedIn") === "true") {
        window.location.href = "profile.html";
      }
    }
  </script>
</body>
</html>
